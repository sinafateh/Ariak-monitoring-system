<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 146" role="img" aria-label="Eight-position DIP switch">
  <defs>
    <linearGradient id="dip-housing" x2="0" y2="1"><stop stop-color="#363b43"/><stop offset="1" stop-color="#20242b"/></linearGradient>
    <linearGradient id="dip-slot"><stop stop-color="#090b0f"/><stop offset=".5" stop-color="#171b21"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
    <linearGradient id="dip-actuator"><stop stop-color="#dce1e7"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#dce1e7"/></linearGradient>
  </defs>
  <style>#dip-switches > .dip-switch > text { fill: #fff; stroke: #20242b; stroke-width: 1px; paint-order: stroke; font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; }</style>
  <rect x="2" y="2" width="476" height="142" rx="12" fill="url(#dip-housing)" stroke="#525963" stroke-width="2"/>
  <text x="9" y="27" direction="ltr" unicode-bidi="bidi-override" text-anchor="start" fill="#fff" stroke="#20242b" stroke-width="1" paint-order="stroke" font-size="18" font-family="Arial,sans-serif" font-weight="700" letter-spacing=".5">ON</text>
